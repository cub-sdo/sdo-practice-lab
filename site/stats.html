<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>SDO Class Statistics</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="shell shell-wide">
  <header class="topbar">
    <a class="wordmark" href="./" aria-label="SDO Practice Lab, open the practice site">
      <span class="wordmark-name">SDO Practice Lab</span>
      <span class="wordmark-sub">Class statistics · for the TA</span>
    </a>
    <button type="button" class="ghost theme-toggle" id="theme-toggle" aria-label="Change colour theme">Theme: Auto</button>
  </header>

  <main id="stats" tabindex="-1">
    <noscript><p class="note">This page needs JavaScript.</p></noscript>
  </main>

  <footer class="footer">
    <p>All numbers are anonymous: the database stores answers without names, student IDs or device identifiers. A "run" is one practice or exam session, so one student can have several runs.</p>
  </footer>
</div>
<script src="config.js"></script>
<script src="questions.js"></script>
<script src="stats.js"></script>
</body>
</html>
